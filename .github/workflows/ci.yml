name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[serve]"
      - name: Unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: OpenAPI snapshot is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.json || (echo "openapi.json 过期：请本地跑 python scripts/export_openapi.py 并提交" && exit 1)

  package:
    name: build sdist + wheel, twine check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Wheel must contain schema.sql and py.typed
        run: |
          python -m zipfile -l dist/*.whl | grep -E "rosmontis/(schema\.sql|py\.typed)"
      - name: Install wheel in clean venv and smoke
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/python -c "import rosmontis, tempfile, os; d=tempfile.mkdtemp(); h=rosmontis.open(os.path.join(d,'t.db')); h.wake('u','c'); h.observe('u','c','我搬到上海了','记住了'); print('ctx', h.context('u','c','我住哪',budget=200)['tokens']); h.close()"
          /tmp/venv/bin/rosmontis --version
