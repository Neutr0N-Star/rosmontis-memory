services:
  rosmontis:
    build: .
    # 只绑本机：默认不把记忆服务暴露到局域网/公网
    ports:
      - "127.0.0.1:8770:8770"
    volumes:
      - ./data:/data
    environment:
      ROSMONTIS_HOME: /data
      # 访问 token：留空则首次启动自动生成并打印在日志里；
      # 也可在 shell 里 export ROSMONTIS_TOKEN=... 显式指定。
      ROSMONTIS_TOKEN: ${ROSMONTIS_TOKEN:-}
      # 离线降级示例；接自己的模型时改成：
      # ROSMONTIS_EMBED: ollama
      # ROSMONTIS_LLM_HOT: openai
      # ROSMONTIS_OPENAI_BASE: https://api.deepseek.com/v1
      # ROSMONTIS_OPENAI_KEY: ${ROSMONTIS_OPENAI_KEY}
      ROSMONTIS_EMBED: hash
      ROSMONTIS_LLM_HOT: rule
    restart: unless-stopped
