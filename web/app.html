<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>藏识 Alaya</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <header class="bar">
    <div class="brand" id="brand" title="切换角色">
      <div class="avatar" id="brandAvatar">藏</div>
      <div class="brand-txt">
        <div class="name" id="cardName">藏识</div>
      </div>
      <span class="caret">▾</span>
    </div>
    <div class="meta" id="meta"></div>
    <div class="acts">
      <button id="btnWizard" class="ghost">建卡</button>
      <button id="btnMemory" class="ghost">记忆</button>
      <button id="btnSettings" class="ghost">设置</button>
      <button id="btnSleep" class="ghost">下一天</button>
    </div>
  </header>

  <main class="chat" id="chat"></main>

  <div class="composer">
    <textarea id="input" rows="1" placeholder="说点什么…  （Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send" class="primary">说</button>
  </div>
</div>

<div class="mask" id="mask"></div>

<!-- 记忆抽屉 -->
<div class="drawer" id="drawer" hidden>
  <div class="drawer-head">
    <h2>记忆</h2>
    <button id="closeDrawer" class="ghost">关</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

<!-- 角色卡切换 -->
<div class="pop" id="cardPop" hidden>
  <div class="pop-head">角色</div>
  <div class="pop-list" id="cardList"></div>
  <button class="pop-new" id="newCard">＋ 新角色</button>
</div>

<!-- 新建角色 -->
<div class="modal" id="newModal" hidden>
  <div class="modal-box">
    <h2>新角色</h2>
    <div class="up-row">
      <div class="avatar big" id="ncAvatarPrev">?</div>
      <div class="up-txt">
        <label class="file-btn">上传头像<input id="ncAvatar" type="file" accept="image/*" hidden></label>
        <p class="hint">不传就用名字首字</p>
      </div>
    </div>
    <label><span>名字</span><input id="ncName" placeholder="比如：深夜便利店"></label>
    <label><span>一句话</span><input id="ncDesc" placeholder="列表里显示的那行"></label>
    <label><span>她的来历</span><textarea id="ncSeed" rows="3" placeholder="她的记忆从这句话开始。留空则从空白开始。"></textarea></label>
    <div class="modal-acts">
      <button id="ncCancel" class="ghost">取消</button>
      <button id="ncSave" class="primary">建</button>
    </div>
  </div>
</div>

<!-- 设置 -->
<div class="modal" id="setModal" hidden>
  <div class="modal-box">
    <h2>设置</h2>

    <div class="up-row">
      <div class="bg-prev" id="bgPrev">无</div>
      <div class="up-txt">
        <label class="file-btn">上传聊天背景<input id="bgFile" type="file" accept="image/*" hidden></label>
        <p class="hint">会自动压暗保证文字可读 <button id="bgClear" class="ghost" style="padding:2px 8px;font-size:10px">清除</button></p>
      </div>
    </div>

    <div class="set-row">
      <span>聊天模型</span>
      <select id="selProv">
        <option value="ollama">本地（Ollama）</option>
        <option value="openai">云端（OpenAI 兼容）</option>
      </select>
    </div>
    <div id="cloudBox">
      <label><span>接口地址</span><input id="setBase" placeholder="https://api.deepseek.com/v1"></label>
      <label><span>密钥</span><input id="setKey" type="password" placeholder="sk-..."></label>
      <label><span>模型名</span><input id="setModel" placeholder="deepseek-chat"></label>
    </div>
    <div id="localBox">
      <label><span>本地模型</span><input id="setLocal" placeholder="minicpm5-2b:q8-64k"></label>
    </div>
    <p class="set-note" id="setNote"></p>

    <div class="modal-acts">
      <button id="setCancel" class="ghost">取消</button>
      <button id="setSave" class="primary">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
