<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>藏识 Alaya · 记忆检查台</title>
<style>
:root{
  --bg:#0f1216; --panel:#171b21; --panel2:#1d222a; --line:#2a313b;
  --text:#e6edf3; --dim:#9ba7b4; --dimmer:#6b7684;
  --accent:#5dcaa5; --accent2:#85b7eb; --warn:#ef9f27; --bad:#e24b4a;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
header{display:flex;align-items:baseline;gap:14px;padding:18px 24px 14px;border-bottom:1px solid var(--line)}
h1{font-size:15px;font-weight:500;letter-spacing:.02em}
.sub{font-size:12px;color:var(--dimmer)}
.spacer{flex:1}
.dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:6px;vertical-align:middle}
.dot.warn{background:var(--warn)}
main{padding:20px 24px 60px;max-width:1400px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.stat .n{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--dimmer);margin-top:2px}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:13px;font-weight:500;color:var(--dim);margin-bottom:12px;letter-spacing:.03em}
.row{display:flex;gap:8px}
input,textarea,select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 11px;font-size:13px;font-family:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--accent2)}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:9px 16px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
button:hover{border-color:var(--accent2)}
button.primary{background:#0f6e56;border-color:#1d9e75;color:#e6edf3}
.pre{background:#0b0e12;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;color:#b9c4cf;max-height:300px;overflow:auto;line-height:1.7}
.hit{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid #20262e;font-size:12px;align-items:baseline}
.hit:last-child{border:0}
.score{font-family:var(--mono);color:var(--accent);min-width:44px;font-variant-numeric:tabular-nums}
.lv{font-family:var(--mono);color:var(--dimmer);min-width:26px}
.kind{color:var(--accent2);min-width:52px}
.tk{color:var(--dimmer);min-width:44px;text-align:right;font-family:var(--mono)}
.hit .txt{flex:1;color:#c8d2dc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--dimmer);font-size:12px}
.list{max-height:340px;overflow:auto}
.item{padding:8px 0;border-bottom:1px solid #20262e;font-size:12.5px}
.item:last-child{border:0}
.item .k{color:var(--accent2)}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:#22303d;color:#9fc4e8;margin-left:6px}
.tag.res{background:#173a2e;color:#7fd8b4}
.tag.imp{background:#3d2f14;color:#e8c07a}
.bar{height:3px;background:#20262e;border-radius:2px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.err{color:var(--bad)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d222a;border:1px solid var(--line);padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:1000px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
  <h1>藏识 Alaya</h1>
  <span class="sub" id="status"><span class="dot"></span>连接中</span>
  <span class="spacer"></span>
  <span class="sub" id="sess">会话 default</span>
</header>

<main>
  <div class="stats" id="stats"></div>

  <div class="grid">
    <div class="card">
      <h2>检索台 · 看它为什么选了这些</h2>
      <div class="row" style="margin-bottom:10px">
        <input id="q" placeholder="问一句，比如「我住哪」「上次说的那件事」" onkeydown="if(event.key==='Enter')doRecall()">
        <button class="primary" onclick="doRecall()">检索</button>
      </div>
      <div class="row" style="margin-bottom:12px;font-size:12px;color:var(--dimmer)">
        <label style="display:flex;align-items:center;gap:6px">
          token 预算 <input id="budget" type="number" value="1400" style="width:80px">
        </label>
        <label style="display:flex;align-items:center;gap:6px">
          时间旅行 <input id="asof" placeholder="留空=现在" style="width:150px">
        </label>
      </div>
      <div id="hits"></div>
      <div id="promptBox" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>常驻活文档 · 每轮直接注入，零检索开销</h2>
      <div id="pages" class="list"><span class="muted">还没有生成。点下面的按钮。</span></div>
      <div class="row" style="margin-top:12px">
        <button onclick="buildPages()">重建活文档</button>
        <button onclick="runForget()">跑遗忘周期</button>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>当前状态 · 时间动力学的锚点</h2>
      <div id="slots" class="list"><span class="muted">无</span></div>
    </div>
    <div class="card">
      <h2>实体 · 带事实数量</h2>
      <div id="ents" class="list"><span class="muted">无</span></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h2>写入</h2>
    <div class="row" style="margin-bottom:8px">
      <select id="role" style="width:110px"><option value="user">对方说</option><option value="assistant">AI 说</option></select>
      <input id="text" placeholder="一句话，回车写入（异步抽取，不阻塞）" onkeydown="if(event.key==='Enter')doIngest()">
      <button class="primary" onclick="doIngest()">写入</button>
    </div>
    <div id="ingestOut" class="muted"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const API = '';
let SESSION = 'default';

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}
async function api(path, opt){
  const r = await fetch(API+path, opt);
  const j = await r.json();
  if(!j.ok) throw new Error((j.error&&j.error.message)||'请求失败');
  return j.data;
}
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function ago(ts){if(!ts)return '—';const d=(Date.now()/1000-ts);if(d<60)return '刚刚';if(d<3600)return Math.floor(d/60)+' 分钟前';if(d<86400)return Math.floor(d/3600)+' 小时前';if(d<2592000)return Math.floor(d/86400)+' 天前';return new Date(ts*1000).toLocaleDateString();}

async function loadStats(){
  try{
    const s = await api('/v1/stats');
    const deg = s.degraded;
    document.getElementById('status').innerHTML =
      `<span class="dot ${deg?'warn':''}"></span>` +
      (deg ? '向量服务降级中（用哈希兜底）' : `向量 ${s.embed.model||'—'} · 抽取 ${s.llm_hot.provider}`);
    const items=[
      ['记忆条目', s.episode], ['其中活跃', s.episode_active],
      ['事实', s.fact_active+'/'+s.fact], ['实体', s.entity], ['当前状态', s.state_open]
    ];
    document.getElementById('stats').innerHTML = items.map(([l,n])=>
      `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  }catch(e){document.getElementById('status').innerHTML='<span class="dot warn"></span>服务未连接';}
}

async function loadPanels(){
  try{
    const [ents, pages, stats] = await Promise.all([
      api('/v1/entities?limit=30'), api('/v1/pages?session_id='+SESSION), api('/v1/stats')
    ]);
    document.getElementById('ents').innerHTML = ents.length ? ents.map(e=>
      `<div class="item"><span class="k">${esc(e.name)}</span> <span class="tag">${esc(e.type)}</span>
       <span class="tag res">${e.fact_count} 条事实</span>
       <div class="muted">${e.mentions} 次提及 · 最近 ${ago(e.last_seen)}</div></div>`).join('')
      : '<span class="muted">无</span>';

    document.getElementById('pages').innerHTML = pages.length ? pages.map(p=>
      `<div class="item"><span class="k">${esc(p.title)}</span>
       <span class="tag">${p.body.length} 字</span>
       <div class="muted" style="margin-top:4px;line-height:1.55">${esc(p.body)}</div></div>`).join('')
      : '<span class="muted">还没有生成。重建一次就会有。</span>';

    const st = await api('/v1/state/'+'我');
    document.getElementById('slots').innerHTML = (st.slots&&st.slots.length) ? st.slots.map(s=>
      `<div class="item"><span class="k">${esc(s.slot)}</span> = ${esc(s.value)}
       <div class="muted">自 ${ago(s.since)}</div></div>`).join('')
      : '<span class="muted">还没有状态记录</span>';
  }catch(e){ console.error(e); }
}

async function doRecall(){
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  const box=document.getElementById('hits'); box.innerHTML='<span class="muted">检索中…</span>';
  try{
    const body={query:q, session_id:SESSION, budget:parseInt(document.getElementById('budget').value)||1400};
    const asof=document.getElementById('asof').value.trim();
    if(asof){ body.as_of = parseFloat(asof); }
    const r=await api('/v1/recall',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.abstained){
      box.innerHTML=`<div class="muted">拒答：${esc(r.reason)}</div>`;
      document.getElementById('promptBox').innerHTML='';
      return;
    }
    box.innerHTML = `<div class="muted" style="margin-bottom:8px">${r.items.length} 条 · ${r.tokens_used}/${r.budget} token · ${r.latency_ms}ms</div>` +
      r.items.map(i=>`<div class="hit">
        <span class="score">${i.score.toFixed(3)}</span>
        <span class="lv">L${i.level}</span>
        <span class="kind">${i.kind}</span>
        <span class="txt">${esc(i.text)}</span>
        <span class="tk">${i.tokens}t</span></div>`).join('');
    document.getElementById('promptBox').innerHTML =
      `<div class="muted" style="margin:10px 0 6px">实际注入的上下文</div><div class="pre">${esc(r.prompt)}</div>`;
  }catch(e){box.innerHTML=`<span class="err">${esc(e.message)}</span>`;}
}

async function doIngest(){
  const t=document.getElementById('text').value.trim();
  if(!t) return;
  const role=document.getElementById('role').value;
  const out=document.getElementById('ingestOut');
  try{
    const r=await api('/v1/episodes',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:t,session_id:SESSION,role:role})});
    out.innerHTML=`已接收 ${r.accept_ms||0}ms · 抽取在后台跑。稍等几秒再看左侧。`;
    document.getElementById('text').value='';
    setTimeout(()=>{loadStats();loadPanels();},2500);
  }catch(e){out.innerHTML=`<span class="err">${esc(e.message)}</span>`;}
}

async function buildPages(){
  toast('重建中…');
  try{ const r=await api('/v1/pages/rebuild?session_id='+SESSION,{method:'POST'});
    toast('重建了 '+r.count+' 页'); loadPanels();
  }catch(e){toast(e.message);}
}
async function runForget(){
  try{ const r=await api('/v1/forget/run?session_id='+SESSION,{method:'POST'});
    toast(`扫描 ${r.scanned} · 折叠 ${r.folded} · 归档 ${r.archived}`); loadStats(); loadPanels();
  }catch(e){toast(e.message);}
}

loadStats(); loadPanels();
setInterval(loadStats, 15000);
</script>
</body>
</html>
